<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#bd1634"><title>LILY SK 스마트 요금 계산기</title><style>*{box-sizing:border-box}body{margin:auto;max-width:600px;background:#f4f5f8;font:16px system-ui;color:#222;padding:16px}header,section{border-radius:18px;padding:20px;margin-bottom:14px;background:white}header{background:#bd1634;color:white}h1{font-size:25px}label{display:block;margin:12px 0 4px}input,select,button{width:100%;padding:12px;font:inherit;border:1px solid #ccc;border-radius:9px}button{background:#bd1634;color:white;border:0;margin-top:10px}nav{display:flex;gap:8px;margin-bottom:14px}strong{font-size:32px;color:#bd1634}small{color:#666}</style><header>LILY · SALES PARTNER<h1>SK 스마트 요금 계산기</h1></header><nav><button onclick="show(false)">요금 계산</button><button onclick="show(true)">제휴카드 관리</button></nav><section id="calc"><label>인터넷</label><select id="net"><option>없음</option><option>100메가</option><option>500메가</option><option>1기가</option></select><label>TV</label><select id="tv"><option>없음</option><option>POP100</option><option>이코노미</option><option>스탠다드</option><option>ALL</option></select><label>기본 월요금 (부가세 포함)</label><input id="base" type="number" min="0" value="0"><label>휴대폰 결합할인</label><input id="family" type="number" min="0" value="0"><label>아파트 단체할인</label><input id="apt" type="number" min="0" value="0"><label>선납권 (0 또는 1,000~15,000원)</label><input id="pre" type="number" min="0" max="15000" value="0"><label>제휴카드</label><select id="card"></select><p>최종 월 납부 예상액</p><strong id="total"></strong><p id="detail"></p><small>할인 중복 적용 가능 여부와 기간은 별도 확인</small><button onclick="copyQuote()">고객 견적 복사</button><button onclick="resetQuote()">새 견적</button></section><section id="manage" hidden><label>카드 이름</label><input id="cn"><label>할인금액</label><input id="ca" type="number" min="0"><label>실적 조건</label><input id="cc"><button onclick="save()">등록 / 수정</button><div id="list"></div></section><script>const $=id=>document.getElementById(id),n=id=>Math.max(0,Number($(id).value)||0),w=x=>x.toLocaleString('ko-KR')+'원';let cards=JSON.parse(localStorage.getItem('lilyCards')||'[]'),edit=-1;function show(v){$('calc').hidden=v;$('manage').hidden=!v}function render(){let old=$('card').value;$('card').replaceChildren(new Option('미적용',''));$('list').replaceChildren();cards.forEach((c,i)=>{ $('card').add(new Option(c.name+' '+w(c.amount),String(i)));let p=document.createElement('p');p.textContent=c.name+' / '+w(c.amount)+' / '+c.condition;let b=document.createElement('button');b.textContent='수정';b.onclick=()=>{edit=i;$('cn').value=c.name;$('ca').value=c.amount;$('cc').value=c.condition};let d=document.createElement('button');d.textContent='삭제';d.onclick=()=>{cards.splice(i,1);persist()};$('list').append(p,b,d)});$('card').value=old;update()}function persist(){localStorage.setItem('lilyCards',JSON.stringify(cards));render()}function save(){if(!$('cn').value.trim()||!n('ca'))return;let c={name:$('cn').value,amount:n('ca'),condition:$('cc').value};if(edit>=0)cards[edit]=c;else cards.push(c);edit=-1;persist();$('cn').value='';$('ca').value='';$('cc').value=''}function selected(){return $('card').value===''?null:cards[Number($('card').value)]}function prepaid(){return n('pre')===0?0:Math.min(15000,Math.max(1000,n('pre')))}function update(){let d=n('family')+n('apt')+prepaid()+(selected()?.amount||0),t=Math.max(0,n('base')-d);$('total').textContent=w(t);$('detail').textContent='할인 합계 '+w(d)+' · 36개월 예상 '+w(t*36);return t}async function copyQuote(){let c=selected(),s='SK 가입 견적\n인터넷 '+$('net').value+' / TV '+$('tv').value+'\n기본요금 '+w(n('base'))+'\n결합 '+w(n('family'))+' / 단체 '+w(n('apt'))+'\n선납권 '+w(prepaid())+'\n카드 '+(c?c.name+' '+w(c.amount)+' '+c.condition:'미적용')+'\n월 예상 '+w(update())+' (부가세 포함)';try{await navigator.clipboard.writeText(s);alert('복사 완료')}catch{prompt('견적 복사',s)}}function resetQuote(){['base','family','apt','pre'].forEach(i=>$(i).value=0);$('card').value='';update()}document.addEventListener('input',update);render()</script></html>
